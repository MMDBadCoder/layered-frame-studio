{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}قاب عکس سه‌بعدی{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/icon-32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/icon-16.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/icon-180.png' %}">
  <meta name="theme-color" content="#0c0c0f">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  {% block content %}{% endblock %}

  {% include "partials/auth_modal.html" %}

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  {{ account|json_script:"account-data" }}
  <script src="{% static 'js/auth.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
